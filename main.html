
<html>
<head>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<h1>BRT GUI</h1>
<br />
<div style="display:flex;flex-direction:row">
    <div class="field border">
        <input type="text" value="COM3" id="serial_port">
        <span class="helper">Serial Port</span>
    </div>
    <div class="field border" style="margin-block-start: 0px;">
        <select id="baudrate">
            <option selected>9600</option>
            <option>14400</option>
            <option>19200</option>
            <option>28800</option>
            <option>38400</option>
            <option>57600</option>
            <option>115200</option>
        </select>
        <i>arrow_drop_down</i>
        <span class="helper">Baudrate</span>
    </div>
    <br />
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
</div>
<br />
<div style="display: flex; gap: 20px; margin-top: 10px;">
    <button onclick="window.location.href='Accumulator.html'">Accumulator</button>
    <button onclick="window.location.href='Telemetrie.html'">Telemetrie</button>
</div>
<br />
<img src="BRT_logo_schrift.png" alt="Logo" style="width: 600px;; margin:20px;">
<br />
<p>Ladestrom: <b id="charging_current"></b>A</p>

<div id="Batteriecontainer"></div>

<div id="detail_container_backdrop" style="z-index:100" class="blur">
    <div id="detailcontainer">
        <div id="headline"
            style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
            <h2 id="stack_headline" style="margin-left: 10px;"></h2>
            <button class="square round extra" style="margin:10px" onclick="hide_detail_container()"><i>close</i>
        </div>
        <div id="detail_data">
            hier so bitte nacher daten einfügen inshallah bruder
        </div>
    </div>
</div>
<div id="footer">
    <p>© 2024 BRT GUI</p>
    <p>Ole Erwin Siegfried Hannemann & Maximus R. Schrang</p>
    <p>Version 1.0.0</p>
</div>
</html>

<style>
    p {
        font-size: larger;
        font-weight: bold;
    }

    button {
        font-size: larger;
        background-color: rgb(0, 87, 162); /* Beispiel: Blau */
        color: white;              /* Textfarbe */
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #217dbb; /* dunkleres Blau beim Hover */
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: rgb(111, 111, 111);
    }

    #close_button {
        background-color: aqua;
        margin: 20px;
        padding: 20px;
        border-radius: 5px;
    }

    #close_button:hover {
        box-shadow: 1px 1px black;
        border-radius: 5px;
        border-style: solid;
        border-width: 1px;
    }

    #Batteriecontainer {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        width: 80%;
        height: 80%;
        overflow: scroll;
    }

    .Batteriebox {
        margin: 5px;
        background-color: rgb(70, 59, 231);
        filter: drop-shadow(5px 5px 2px rgba(00, 00, 00, 0.35));
        padding: 10px;
        border-radius: 10px;
        width: 10vw;
    }

    #detail_container_backdrop {
        display: none;
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        align-items: center;
        justify-content: center;
    }

    #detailcontainer {
        z-index: 999;
        background-color: rgb(200, 200, 200);
        border-radius: 10px;
        width: 50%;
        height: 80%;
    }

    #detail_data {
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
        justify-content: center;
    }
</style>

<script>
    let charging_current = document.getElementById("charging_current");
    let detailcontainer = document.getElementById("detail_container_backdrop");
    let main_container = document.getElementById("Batteriecontainer");
    let detail_stack_number = document.getElementById("stack_headline");
    let detail_data = document.getElementById("detail_data");
    let serial_port = document.getElementById("serial_port");
    let baud_rate = document.getElementById("baudrate");
    let connect_button = document.getElementById("connect");
    let disconnect_button = document.getElementById("disconnect");

    connect_button.addEventListener("click", establish_connection);
    disconnect_button.addEventListener("click", disconnect);

    let chargingChart = null;

    async function establish_connection() {
        let response = await fetch("/connection", {
            method: "post",
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ port: serial_port.value, baudrate: baud_rate.value })
        });
        console.log(await response.json());
    }

    async function disconnect() {
        await fetch("/connection", { method: "delete" });
    }

    async function get_connection_state() {
        let response = await fetch(`/connection`);
        let data = await response.json();

        if (data.connected) {
            connect_button.style.display = "none";
            disconnect_button.style.display = "block";
            serial_port.value = data.connected_port;
        } else {
            disconnect_button.style.display = "none";
            connect_button.style.display = "block";
        }
        return data;
    }

    async function get_charging_current() {
        let response = await fetch("/charging_current");
        let data = await response.json();
        charging_current.textContent = data.charging_current;

        // Live-Graph aktualisieren
        if (chargingChart) {
            const now = new Date().toLocaleTimeString();
            chargingChart.data.labels.push(now);
            chargingChart.data.datasets[0].data.push(data.charging_current);

            if (chargingChart.data.labels.length > 10000) {
                chargingChart.data.labels.shift();
                chargingChart.data.datasets[0].data.shift();
            }

            chargingChart.update();
        }
    }

    async function get_stack_info(stack_number) {
        let response = await fetch(`/stack/${stack_number}`);
        return await response.json();
    }

    async function get_stack_detailed_info(stack_number) {
        let response = await fetch(`/stack/detailed/${stack_number}`);
        return await response.json();
    }

    function hide_detail_container() {
        detailcontainer.style.display = "none";
    }

    function create_stack_boxes() {
        for (let i = 0; i < 12; i++) {
            let box = document.createElement("div");
            box.classList = "Batteriebox";
            box.id = `container_${i}`;
            box.onclick = () => { show_stack_details(i) };

            box.innerHTML = `
                <p class="stack_number">Stack: ${i}</p>
                <p class="voltage">Spannung: --</p>
                <p class="temperature">Temperatur: --</p>
                <p class="stack_voltage">Sum Voltage: --</p>
            `;

            main_container.appendChild(box);
        }
    }

    async function update_container_text(container_id) {
        let container = document.getElementById(`container_${container_id}`);
        let data = await get_stack_info(container_id);

        container.querySelector(".voltage").textContent =
            `Spannung: ${data.voltage_min}V - ${data.voltage_max}V`;
        container.querySelector(".temperature").textContent =
            `Temperatur: ${data.temperature_min}C - ${data.temperature_max}C`;
        container.querySelector(".stack_voltage").textContent =
            `Sum Voltage: ${data.sum_voltage}V`;
    }

    async function show_stack_details(stack_id) {
        detailcontainer.style.display = "flex";
        detail_stack_number.textContent = `Stack ${stack_id}`;
        detail_data.innerHTML = "";

        let data = await get_stack_detailed_info(stack_id);

        for (let i = 0; i < 12; i++) {
            let tmp = document.createElement("div");
            tmp.classList = "Batteriebox";
            tmp.innerHTML = `
                <p>Zelle: ${i}</p>
                <p>Spannung: ${data.voltages[i]}V</p>
                <p>Temperatur: ${data.temperatures[i]}C</p>
            `;
            detail_data.appendChild(tmp);
        }
    }

    // Initialisierung
    create_stack_boxes();

    setInterval(() => {
        get_connection_state();
    }, 5000);

    get_connection_state();
</script>
