
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/styles.css">
    <style>
.usb-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 90;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    width: 100%;
    box-sizing: border-box;
    padding: 8px 16px;
    text-align: left;
    background: rgb(200, 200, 200);
}
body { padding-top: 64px; }
.usb-details { line-height: 1.6; }
.usb-status {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-left: auto;
}
.usb-dot {
    display: inline-block;
    flex: 0 0 20px;
    width: 20px;
    height: 20px;
    overflow: visible;
}
@media (max-width: 540px) {
    .usb-bar { padding: 8px; gap: 8px; font-size: 13px; }
    .usb-status { max-width: 55%; }
}
</style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<h1>BRT GUI</h1>
<br />
<div class="usb-bar">
    <div class="usb-details">
        <div>Verbunden mit: <b id="connected_port">--</b></div>
    </div>
    <div class="usb-status" role="status" aria-live="polite" data-state="searching">
        <svg class="usb-dot" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#e88a08" /></svg>
        <span id="connection_status">USB nicht gefunden – wird gesucht</span>
    </div>
</div>
<br />
<div style="display: flex; gap: 20px; margin-top: 10px;">
    <button onclick="window.location.href='Accumulator.html'">Accumulator</button>
    <button onclick="window.location.href='Telemetrie.html'">Telemetrie</button>
</div>
<br />
<img src="BRT_logo_schrift.png" alt="Logo" style="width: 600px;; margin:20px;">
<br />

<div id="footer">
    <p>© 2024 BRT GUI</p>
    <p>Ole Erwin Siegfried Hannemann & Maximus R. Schrang</p>
    <p>Version 1.0.0</p>
</div>
</html>

<style>
    p {
        font-size: larger;
        font-weight: bold;
    }

    button {
        font-size: larger;
        background-color: rgb(0, 87, 162); /* Beispiel: Blau */
        color: white;              /* Textfarbe */
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #217dbb; /* dunkleres Blau beim Hover */
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: rgb(111, 111, 111);
    }

    #close_button {
        background-color: aqua;
        margin: 20px;
        padding: 20px;
        border-radius: 5px;
    }

    #close_button:hover {
        box-shadow: 1px 1px black;
        border-radius: 5px;
        border-style: solid;
        border-width: 1px;
    }

    #Batteriecontainer {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        width: 80%;
        height: 80%;
        overflow: scroll;
    }

    .Batteriebox {
        margin: 5px;
        background-color: rgb(70, 59, 231);
        filter: drop-shadow(5px 5px 2px rgba(00, 00, 00, 0.35));
        padding: 10px;
        border-radius: 10px;
        width: 10vw;
    }

    #detail_container_backdrop {
        display: none;
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        align-items: center;
        justify-content: center;
    }

    #detailcontainer {
        z-index: 999;
        background-color: rgb(200, 200, 200);
        border-radius: 10px;
        width: 50%;
        height: 80%;
    }

    #detail_data {
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
        justify-content: center;
    }
</style>
