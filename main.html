
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<h1>BRT GUI</h1>
<br />
<div style="display:flex;flex-direction:row">
    <div class="field border">
        <input type="text" value="COM3" id="serial_port">
        <span class="helper">Serial Port</span>
    </div>
    <div class="field border" style="margin-block-start: 0px;">
        <select id="baudrate">
            <option>9600</option>
            <option>14400</option>
            <option>19200</option>
            <option>28800</option>
            <option>38400</option>
            <option>57600</option>
            <option selected>115200</option>
        </select>
        <i>arrow_drop_down</i>
        <span class="helper">Baudrate</span>
    </div>
    <br />
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
    <span id="connection_status" role="status">Nicht verbunden</span>
</div>
<br />
<div style="display: flex; gap: 20px; margin-top: 10px;">
    <button onclick="window.location.href='Accumulator.html'">Accumulator</button>
    <button onclick="window.location.href='Telemetrie.html'">Telemetrie</button>
</div>
<br />
<img src="BRT_logo_schrift.png" alt="Logo" style="width: 600px;; margin:20px;">
<br />

<div id="footer">
    <p>© 2024 BRT GUI</p>
    <p>Ole Erwin Siegfried Hannemann & Maximus R. Schrang</p>
    <p>Version 1.0.0</p>
</div>
</html>

<style>
    p {
        font-size: larger;
        font-weight: bold;
    }

    button {
        font-size: larger;
        background-color: rgb(0, 87, 162); /* Beispiel: Blau */
        color: white;              /* Textfarbe */
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #217dbb; /* dunkleres Blau beim Hover */
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: rgb(111, 111, 111);
    }

    #close_button {
        background-color: aqua;
        margin: 20px;
        padding: 20px;
        border-radius: 5px;
    }

    #close_button:hover {
        box-shadow: 1px 1px black;
        border-radius: 5px;
        border-style: solid;
        border-width: 1px;
    }

    #Batteriecontainer {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        width: 80%;
        height: 80%;
        overflow: scroll;
    }

    .Batteriebox {
        margin: 5px;
        background-color: rgb(70, 59, 231);
        filter: drop-shadow(5px 5px 2px rgba(00, 00, 00, 0.35));
        padding: 10px;
        border-radius: 10px;
        width: 10vw;
    }

    #detail_container_backdrop {
        display: none;
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        align-items: center;
        justify-content: center;
    }

    #detailcontainer {
        z-index: 999;
        background-color: rgb(200, 200, 200);
        border-radius: 10px;
        width: 50%;
        height: 80%;
    }

    #detail_data {
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
        justify-content: center;
    }
</style>

<script>
    let serial_port = document.getElementById("serial_port");
    let baud_rate = document.getElementById("baudrate");
    let connect_button = document.getElementById("connect");
    let disconnect_button = document.getElementById("disconnect");

    connect_button.addEventListener("click", () => establish_connection());
    disconnect_button.addEventListener("click", () => disconnect());



    // Connection status is updated by connection.js.
</script>


<script src="/connection.js"></script>
