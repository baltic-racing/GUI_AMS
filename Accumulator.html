

<html>

<head>
    <meta charset="utf-8">

    <title>Accumulator</title>

    <link rel="stylesheet" href="/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <h1>Accumulator</h1>

    <!-- Hier kannst du später Inhalte ergänzen -->

</body>



<div style="display:flex;flex-direction:row">

    <div class="field border">

        <input type="text" placeholder="COM-Port auswählen" id="serial_port">

        <span class="helper">Serial Port</span>

    </div>

    <div class="field border" style="margin-block-start: 0px;">

        <select id="baudrate">

            <option>9600</option>

            <option>14400</option>

            <option>19200</option>

            <option>28800</option>

            <option>38400</option>

            <option>57600</option>

            <option selected>115200</option>

        </select>

        <i>arrow_drop_down</i>

        <span class="helper">Baudrate</span>

    </div>

    <br />

    <button id="connect">Connect</button>

    <button id="disconnect">Disconnect</button>
    <span id="connection_status" role="status">Nicht verbunden</span>

</div>



<!--

    <select id="serial_port">

        <option selected>COM3</option>

        <option>COM4</option>

        <option>COM5</option>

        <option>COM6</option>

    </select>

    <i>arrow_drop_down</i>

    <span class="helper">Serial Port</span>

</div>

-->

<div style="display: flex; flex-direction: row; justify-content: space-between; width: 100%;">

    <p>Verbunden mit: <b id="connected_port">--</b></p>

</div>



<p>Ladestrom: <b id="charging_current"></b>A</p>
<p>LTC Temperatur (0x2D): <b id="ltc_temperature">--</b> &deg;C</p>

<div class="chart-container">
    <canvas id="chargingGraph"></canvas>
</div>

<br />

<div class="chart-container">
    <canvas id="cellGraph"></canvas>
</div>

<br />



<div id="Batteriecontainer"></div>



<div id="detail_container_backdrop" style="z-index:100" class="blur">

    <div id="detailcontainer">

        <div id="headline"

            style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;">

            <h2 id="stack_headline" style="margin-left: 10px;"></h2>

            <button class="square round extra" style="margin:10px" onclick="hide_detail_container()"><i>close</i></button>

        </div>

        <div id="detail_data">



        </div>

    </div>

</div>

<div id="footer">

    <p>© 2024 BRT Accumulator</p>

</div>



<style>

    p {

        font-size: larger;

        font-weight: bold;

    }



    button {

        font-size: larger;

    }



    body {

        display: flex;

        flex-direction: column;

        align-items: center;

        /*background-color: rgb(20, 19, 22);*/

        background-color: rgb(200, 200, 200)

    }



    /* Chart.js keeps render size and pointer coordinates in sync with this container. */
    .chart-container {

        position: relative;
        width: calc(100% - 200px);
        min-width: 0;
        flex: none;

        margin-left: 40px;

        margin-right: 40px;

        height: 600px;



    }






    #close_button {

        background-color: aqua;

        margin: 20px;

        padding: 20px;

        border-radius: 5px;

    }



    #close_button:hover {

        box-shadow: 1px 1px black;

        border-radius: 5px;

        border-style: solid;

        border-width: 1px;

    }



    #Batteriecontainer {

        display: flex;

        flex-direction: column;

        width: 95%;

        gap: 20px;

    }



    .Stackbox {

        box-sizing: border-box;

        width: 100%;

        padding: 15px;

        background-color: rgb(180, 180, 180);

        border-radius: 12px;

        filter: drop-shadow(3px 3px 3px rgba(0, 0, 0, 0.25));

    }



    .stack_header {

        display: flex;

        flex-wrap: wrap;

        justify-content: space-between;

        align-items: center;

        gap: 20px;

    }



    .stack_summary {

        display: flex;

        flex-wrap: wrap;

        justify-content: flex-end;

        gap: 8px 20px;

    }



    .stack_summary p {

        margin: 0;

    }



    .cells_grid {

        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));

        gap: 10px;

    }



    .cell_box {

        min-width: 0;

        padding: 10px;

        background-color: rgb(70, 59, 231);

        border-radius: 10px;

        filter: drop-shadow(3px 3px 2px rgba(0, 0, 0, 0.25));

    }



    .cell_box.balancing, .Batteriebox.balancing {
        background-color: rgb(255, 170, 0);
        color: #1a1a1a;
        box-shadow: inset 0 0 0 3px rgb(255, 210, 80);
    }

    .balance_status {
        min-height: 1.5em;
    }

    .cell_box p {

        margin: 5px 0;

    }



    .Batteriebox {

        margin: 5px;

        background-color: rgb(70, 59, 231);

        filter: drop-shadow(5px 5px 2px rgba(00, 00, 00, 0.35));

        padding: 10px;

        border-radius: 10px;

        width: 10vw;

    }



    #detail_container_backdrop {

        display: none;

        position: absolute;

        width: 100%;

        height: 100%;

        top: 0;

        left: 0;

        background-color: rgba(0, 0, 0, 0.8);

        backdrop-filter: blur(10px);

        align-items: center;

        justify-content: center;

    }



    #detailcontainer {

        z-index: 999;

        background-color: rgb(200, 200, 200);

        border-radius: 10px;

        width: 90%;

        height: 90%;

    }



    #detail_data {

        display: flex;

        flex-wrap: wrap;

        flex-direction: row;

        justify-content: center;

    }

</style>



<script>

    let charging_current = document.getElementById("charging_current");

    let detailcontainer = document.getElementById("detail_container_backdrop");

    let main_container = document.getElementById("Batteriecontainer");

    let detail_stack_number = document.getElementById("stack_headline");

    let detail_data = document.getElementById("detail_data");

    let serial_port = document.getElementById("serial_port");

    let baud_rate = document.getElementById("baudrate");

    let connect_button = document.getElementById("connect");

    let disconnect_button = document.getElementById("disconnect");



    connect_button.addEventListener("click", () => establish_connection());

    disconnect_button.addEventListener("click", () => disconnect());



    async function get_charging_current() {
        const [response, ltcResponse] = await Promise.all([
            fetch("/charging_current"),
            fetch("/ltc_temperature")
        ]);
        const ltcData = await ltcResponse.json();
        document.getElementById("ltc_temperature").textContent = ltcData.ltc_temperature ?? "--";


        let data = await response.json();

        charging_current.textContent = data.charging_current ?? "--";



        const now = new Date().toLocaleTimeString();

        // Live-Graph aktualisieren

        if (window.chargingChart) {

            window.chargingChart.data.labels.push(now);

            window.chargingChart.data.datasets[0].data.push(data.charging_current);



            if (window.chargingChart.data.labels.length > 1000) {

                window.chargingChart.data.labels.shift();

                window.chargingChart.data.datasets[0].data.shift();

            }



            window.chargingChart.update();

        }

    }



    async function update_cell_graph() {

        // Werte vom Backend holen

        const [voltage_max, voltage_min, temperature_max, temperature_min] = await Promise.all([

            fetch("/cell_voltage_max").then(res => res.json()).then(data => data.cell_voltage_max),

            fetch("/cell_voltage_min").then(res => res.json()).then(data => data.cell_voltage_min),

            fetch("/cell_temperature_max").then(res => res.json()).then(data => data.cell_temperature_max),

            fetch("/cell_temperature_min").then(res => res.json()).then(data => data.cell_temperature_min)

        ]);



        // Zeitstempel für die X-Achse

        const now = new Date().toLocaleTimeString();



        // Chart aktualisieren

        if (window.cellChart) {

            window.cellChart.data.labels.push(now);

            window.cellChart.data.datasets[0].data.push(voltage_max);

            window.cellChart.data.datasets[1].data.push(voltage_min);

            window.cellChart.data.datasets[2].data.push(temperature_max);

            window.cellChart.data.datasets[3].data.push(temperature_min);



            // Optional: Begrenze die Anzahl der Punkte

            if (window.cellChart.data.labels.length > 1000) {

                window.cellChart.data.labels.shift();

                window.cellChart.data.datasets.forEach(ds => ds.data.shift());

            }



            window.cellChart.update();

        }

    }



    async function get_stack_info(stack_number) {

        let response = await fetch(`/stack/${stack_number}`);

        return await response.json();

    }



    async function get_stack_detailed_info(stack_number) {

        let response = await fetch(`/stack/detailed/${stack_number}`);

        return await response.json();

    }



    function hide_detail_container() {

        detailcontainer.style.display = "none";

    }



    function create_stack_boxes() {

        for (let stack = 0; stack < 12; stack++) {

            let stackBox = document.createElement("section");

            stackBox.classList = "Stackbox";

            stackBox.id = `container_${stack}`;

            stackBox.innerHTML = `

                <div class="stack_header">

                    <h2>Stack ${stack}</h2>

                    <div class="stack_summary">

                        <p class="stack_voltage">Sum Voltage: -- V</p>

                        <p class="voltage_min">Spannung min: -- V</p>

                        <p class="voltage_max">Spannung max: -- V</p>

                        <p class="temperature_min">Temperatur min: -- &deg;C</p>

                        <p class="temperature_max">Temperatur max: -- &deg;C</p>

                        <p class="ltc_temperature">LTC intern: -- &deg;C</p>

                        <p class="balancing_info">Balancing: warte auf Daten</p>

                    </div>

                </div>

                <div class="cells_grid">

                    ${Array.from({ length: 11 }, (_, cell) => `

                        <div class="cell_box" id="stack_${stack}_cell_${cell}">

                            <p><b>Zelle ${cell}</b></p>

                            <p class="cell_voltage">Spannung: -- V</p>

                            <p class="cell_temperature">Temperatur: -- &deg;C</p>

                            <p class="balance_status">Balancing: unbekannt</p>

                        </div>

                    `).join("")}

                </div>

            `;

            main_container.appendChild(stackBox);

        }

    }



    async function update_container_text(stack_id) {

        let container = document.getElementById(`container_${stack_id}`);

        let [data, stackInfo] = await Promise.all([

            get_stack_detailed_info(stack_id),

            get_stack_info(stack_id)

        ]);

        let voltages = Array.isArray(data.voltages) ? data.voltages : [];

        let temperatures = Array.isArray(data.temperatures) ? data.temperatures : [];

        let balancing = Array.isArray(data.balancing) ? data.balancing : [];

        const balancingAvailable = data.balancing_available === true && !data.stale;
        container.querySelector(".balancing_info").textContent = data.stale
            ? "Balancing: keine aktuellen Stackdaten"
            : data.balancing_available === undefined
                ? "Balancing: GUI-Server neu starten"
                : !balancingAvailable
                    ? `Balancing: nicht übertragen (${data.stack_payload_bytes} Byte). Firmware-Erweiterung erforderlich.`
                    : `Balancing: ${balancing.filter(value => value === true).length} Kanäle aktiv`;

        let sumVoltage = stackInfo.sum_voltage;



        container.querySelector(".stack_voltage").textContent =

            `Sum Voltage: ${sumVoltage == null ? "--" : sumVoltage.toFixed(3)} V`;

        container.querySelector(".voltage_min").textContent =

            `Spannung min: ${stackInfo.voltage_min ?? "--"} V`;

        container.querySelector(".voltage_max").textContent =

            `Spannung max: ${stackInfo.voltage_max ?? "--"} V`;

        container.querySelector(".temperature_min").textContent =

            `Temperatur min: ${stackInfo.temperature_min ?? "--"} \u00B0C`;

        container.querySelector(".temperature_max").textContent =

            `Temperatur max: ${stackInfo.temperature_max ?? "--"} \u00B0C`;

        container.querySelector(".ltc_temperature").textContent =

            `LTC intern: ${stackInfo.ltc_temperature ?? "--"} \u00B0C`;



        for (let cell = 0; cell < 11; cell++) {

            let cellBox = document.getElementById(`stack_${stack_id}_cell_${cell}`);

            const isBalancing = balancingAvailable && balancing[cell] === true;
            cellBox.classList.toggle("balancing", isBalancing);
            cellBox.querySelector(".balance_status").textContent = !balancingAvailable
                ? "Balancing: unbekannt" : isBalancing ? "BALANCING" : "Balancing: aus";

            cellBox.querySelector(".cell_voltage").textContent =

                `Spannung: ${voltages[cell] ?? "--"} V`;

            cellBox.querySelector(".cell_temperature").textContent =

                `Temperatur: ${temperatures[cell] ?? "--"} \u00B0C`;

        }

    }



    async function show_stack_details(stack_id) {

        detailcontainer.style.display = "flex";

        detail_stack_number.textContent = `Stack ${stack_id}`;

        detail_data.innerHTML = "";



        let data = await get_stack_detailed_info(stack_id);
        const ltcInfo = document.createElement("p");
        ltcInfo.textContent = `LTC intern: ${data.ltc_temperature ?? "--"} \u00B0C`;
        detail_data.appendChild(ltcInfo);



        for (let i = 0; i < 11; i++) {

            let tmp = document.createElement("div");

            tmp.classList = "Batteriebox";

            const balancingAvailable = data.balancing_available === true && !data.stale;
            const isBalancing = balancingAvailable && data.balancing?.[i] === true;
            tmp.classList.toggle("balancing", isBalancing);

            tmp.innerHTML = `

                <p>Zelle: ${i}</p>

                <p>Spannung: ${data.voltages[i] ?? "--"}V</p>

                <p>Temperatur: ${data.temperatures[i] ?? "--"}C</p>

                <p class="balance_status">${!balancingAvailable ? "Balancing: unbekannt" : isBalancing ? "BALANCING" : "Balancing: aus"}</p>

            `;

            detail_data.appendChild(tmp);

        }

    }



    function setupChargingGraph() {

        const ctx = document.getElementById('chargingGraph').getContext('2d');

        window.chargingChart = new Chart(ctx, {

            type: 'line',

            data: {

                labels: [],

                datasets: [{

                    label: 'Ladestrom (A)',

                    borderColor: 'rgb(75, 192, 192)',

                    backgroundColor: 'rgba(75, 192, 192, 0.2)',

                    data: [],

                    tension: 0.3

                }]

            },

            options: {

                animation: false,
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'nearest', axis: 'xy', intersect: false },

                scales: {

                    x: {

                        title: {display: true,text: 'Zeit'},

                        ticks: {

                            maxTicksLimit: 10 // Begrenze die Anzahl der X-Achsen-Ticks

                        }

                    },

                    y: {

                        beginAtZero: true,

                        title: {display: true, text: 'Strom (A)'},

                        beginAtZero: true,

                        suggestedMax: 35, // Maximalwert für den Ladestrom

                    }

                }

            }

        });

    }



    function setupCellGraph() {

        const ctx = document.getElementById('cellGraph').getContext('2d');

        window.cellChart = new Chart(ctx, {

            type: 'line',

            data: {

                labels: [], // Zeitpunkte

                datasets: [

                    {

                        label: 'cell_voltage_max',

                        borderColor: 'red',

                        backgroundColor: 'rgba(255,0,0,0.1)',

                        data: [],

                        yAxisID: 'y',

                    },

                    {

                        label: 'cell_voltage_min',

                        borderColor: 'blue',

                        backgroundColor: 'rgba(0,0,255,0.1)',

                        data: [],

                        yAxisID: 'y',

                    },

                    {

                        label: 'cell_temperature_max',

                        borderColor: 'orange',

                        backgroundColor: 'rgba(255,165,0,0.1)',

                        data: [],

                        yAxisID: 'y1',

                    },

                    {

                        label: 'cell_temperature_min',

                        borderColor: 'green',

                        backgroundColor: 'rgba(0,255,0,0.1)',

                        data: [],

                        yAxisID: 'y1',

                    }

                ]

            },

            options: {

                animation: false,
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'nearest', axis: 'xy', intersect: false },

                scales: {

                    x: {

                        title: { display: true, text: 'Zeit' },

                        ticks: {

                            maxTicksLimit: 10 // Begrenze die Anzahl der X-Achsen-Ticks

                        }

                    },

                    y: {

                        position: 'left',

                        title: { display: true, text: 'Voltage (V)' },

                        beginAtZero: true,

                        suggestedMax: 5,

                    },

                    y1: {

                        position: 'right',

                        title: { display: true, text: 'Temperature (\u00B0C)' },

                        grid: { drawOnChartArea: false },

                        beginAtZero: true,

                        suggestedMax: 70,

                    }

                }

            }

        });

    }



    // Initialisierung

    if (typeof Chart !== "undefined") setupChargingGraph();

    if (typeof Chart !== "undefined") setupCellGraph();

    // Alle Stacks inklusive ihrer Zellen direkt anzeigen

    create_stack_boxes();

    for (let i = 0; i < 12; i++) {

        update_container_text(i);

    }



    setInterval(() => {

        get_charging_current();

        update_cell_graph();

    }, 1000);



    setInterval(() => {

        for (let i = 0; i < 12; i++) {

            update_container_text(i);

        }

    }, 1000);







    // Connection status is updated by connection.js.

    get_charging_current();

    update_cell_graph();



</script>



</html>
<script src="/connection.js"></script>
